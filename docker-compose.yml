version: '3.8'

services:
  # Base de datos requerida por SonarQube (PostgreSQL)
  db:
    image: postgres:12
    container_name: postgres_certamen
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - postgresql:/var/lib/postgresql
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - net_certamen

  # Servicio de SonarQube
  sonarqube:
    image: sonarqube:25.9.0.112764-community
    container_name: sonarqube_certamen
    depends_on:
      - db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ports:
      - "9000:9000"
    networks:
      - net_certamen

  # Servicio de Jenkins (Apunta a Dockerfile.jenkins)
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins # <-- Crucial: Aquí lee el entorno de tu clase
    container_name: jenkins_certamen
    depends_on:
      - sonarqube
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - net_certamen

# Definición de Volúmenes para persistencia
volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql:
  postgresql_data:
  jenkins_data:

# Red interna común
networks:
  net_certamen:
    driver: bridge